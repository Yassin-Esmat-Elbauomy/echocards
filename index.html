<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoCards — Offline Flashcard & Study App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div></div>""
        <h1>EchoCards</h1>
        <p class="subtitle">Offline flashcards with speech synthesis</p>
      </div>
    </div>

    <div class="header-controls">
      <div class="tts-bar" aria-label="Text to speech controls">
        <button id="muteBtn" class="btn btn-outline" type="button" title="Toggle Mute">
          Sound On
        </button>button></button>""

        <label class="rate-control" for="rateSlider">
          <span>Speed: <strong id="rateValue">1.0x</strong></span>
          <input id="rateSlider" type="range" min="0.5" max="2.0" step="0.1" value="1.0" />
        </label>

        <label class="auto-speak-control">
          <input id="autoSpeakToggle" type="checkbox" />
          <span>Auto-speak</span>
        </label>

        <select id="voiceSelect" class="voice-select" aria-label="Select speech voice">
          <option value="">Default Voice</option>
        </select>
      </div>

      <div class="mode-switcher" role="group" aria-label="View mode">
        <button id="studyModeBtn" class="mode-btn active" type="button">Study Mode</button>
        <button id="manageModeBtn" class="mode-btn" type="button">Manage Cards</button>
      </div>
    </div>
  </header>

  <main class="app-layout">
    <aside class="sidebar">
      <deck-list id="deckList"></deck-list>
    </aside>

    <section class="workspace">
      <div id="activeDeckBanner" class="deck-banner">
        <div>
          <span class="deck-banner-label">Current Deck</span>
          <h2 id="activeDeckTitle">Loading decks...</h2>
        </div>
        <span id="activeDeckCount" class="deck-count-pill">0 cards</span>
      </div>

      <flash-card id="flashCardView"></flash-card>
      <card-editor id="cardEditorView" class="hidden"></card-editor>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
